name: Publish

# Called by release-please.yml only. That file must be the trusted-publisher
# entry on npmjs.com, because trusted publishing validates the calling workflow.
# Publishes with npm trusted publishing (OIDC): no npm token is used.
on:
  workflow_call:
    inputs:
      tag:
        description: 'npm dist-tag to publish under'
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm check
      - name: Pack npm artifact
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted-publisher environment on npmjs.com must be `npm`.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Pin npm for trusted publishing
        run: npm install -g npm@^11.21.0
      - name: Publish to npm (trusted publishing)
        env:
          NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          package_file="$(find "$PWD/dist" -maxdepth 1 -name '*.tgz' -print -quit)"
          if [ -z "$package_file" ]; then
            echo "No package tarball found"
            exit 1
          fi
          npm publish "$package_file" --provenance --access public --tag "$NPM_DIST_TAG"
